name: Uppdatera nyheter och publicera
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/translation-requirements.txt
      - uses: actions/cache@v4
        with:
          path: public/data/news.json
          key: news-${{ github.run_id }}
          restore-keys: news-
      - uses: actions/cache@v4
        with:
          path: .cache/translation
          key: translation-v3-${{ github.run_id }}
          restore-keys: translation-v3-
      - run: pip install -r scripts/translation-requirements.txt
      - run: python scripts/fetch-news.py
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python -m unittest discover -s tests -p '*_test.py'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
