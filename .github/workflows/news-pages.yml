name: Uppdatera nyheter och publicera
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages-automatic
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages-automatic
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore local editor model
        uses: actions/cache@v4
        with:
          path: .cache/editor/model4.gguf
          key: kryptokollen-qwen3-4b-q4km-linux-v1
      - name: Install optional local editor
        continue-on-error: true
        run: pip install -r scripts/editor-requirements.txt
      - name: Collect and edit news
        env:
          RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL }}
          EDITOR_MODE: 'local-validated'
          EDITOR_MAX_ITEMS: '1'
          EDITOR_SECONDS: '210'
        run: python scripts/fetch-news.py
      - name: Restore recent X selection
        uses: actions/cache@v4
        with:
          path: public/data/x.json
          key: x-embed-v1-${{ github.run_id }}
          restore-keys: x-embed-v1-
      - name: Collect original X posts
        run: python scripts/fetch-x.py
      - name: Prepare Swedish X cards
        run: python scripts/x_language.py
      - run: python scripts/fetch-market.py
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python -m unittest discover -s tests -p '*_test.py'
      - name: Persist new articles before deployment
        run: |
          if ! git diff --quiet -- public/data/archive.json || [ -n "$(git ls-files --others --exclude-standard public/data/archive.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/archive.json public/data/news.json public/data/health.json
            git commit -m 'Archive approved Kryptokollen articles [skip ci]'
            # A concurrent code push must never be overwritten. A rejected push stops deployment.
            git push origin HEAD:main
            npm run build
          fi
      - name: Save review queue
        uses: actions/upload-artifact@v4
        with:
          name: editorial-review-queue
          path: |
            state/pending.json
            state/x-language-review.json
          retention-days: 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
