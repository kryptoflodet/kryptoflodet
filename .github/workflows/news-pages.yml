name: Uppdatera nyheter och publicera
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages-automatic
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    environment:
      name: github-pages-automatic
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Collect and edit news
        env:
          RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL }}
          EDITOR_MODE: 'reviewed-only'
        run: python scripts/fetch-news.py
      - name: Restore recent X selection
        uses: actions/cache@v4
        with:
          path: public/data/x.json
          key: x-public-profile-v2-${{ github.run_id }}
          restore-keys: |
            x-public-profile-v2-
            x-embed-v1-
      - name: Collect original X posts
        run: python scripts/fetch-x.py
      - name: Restore source-bound X translations and local model
        uses: actions/cache@v4
        with:
          path: .cache/x-translation
          key: x-swedish-v3-${{ github.run_id }}
          restore-keys: x-swedish-v3-
      - name: Prepare local Swedish translator
        run: python scripts/prepare_x_translator.py
      - name: Prepare Swedish X cards
        run: python scripts/x_language.py
      - name: Translate every collected X post automatically
        env:
          X_TRANSLATION_SECONDS: '480'
        run: python scripts/x_translate.py
      - name: Preserve permanent X links
        run: python scripts/x_archive.py
      - run: python scripts/fetch-market.py
      - name: Restore latest market context values
        uses: actions/cache@v4
        with:
          path: .cache/market-context/context.json
          key: market-context-${{ github.run_id }}
          restore-keys: market-context-
      - name: Refresh fear, trend, dominance and altcoin season
        env:
          MARKET_CONTEXT_STATE_URL: https://kryptopuls.se/data/market-context.json
        run: python scripts/fetch-market-context.py
      - run: npm run build
      - run: npm test
      - run: python -m unittest discover -s tests -p '*_test.py'
      - name: Persist new articles before deployment
        run: |
          if ! git diff --quiet -- public/data/archive.json public/data/x-archive.json || [ -n "$(git ls-files --others --exclude-standard public/data/archive.json public/data/x-archive.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/archive.json public/data/news.json public/data/health.json public/data/x-archive.json public/data/x.json
            git commit -m 'Archive approved Kryptopuls articles [skip ci]'
            # A concurrent code push must never be overwritten. A rejected push stops deployment.
            git push origin HEAD:main
            npm run build
          fi
      - name: Save review queue
        uses: actions/upload-artifact@v4
        with:
          name: editorial-review-queue
          path: |
            state/pending.json
            state/x-language-review.json
          retention-days: 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
