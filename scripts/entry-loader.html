<!-- Shared first-visit animation; no network request or dependency. -->
<style>
.kp-entry-loader{--coin-size:clamp(48px,7vw,80px);position:fixed;inset:0;z-index:1000;overflow:hidden;pointer-events:none;background:#101214}
:root[data-theme="light"] .kp-entry-loader{background:#f1f3f1}
.kp-entry-track{position:absolute;left:calc(-1 * var(--coin-size));top:calc(50% - var(--coin-size) / 2);width:var(--coin-size);height:var(--coin-size);will-change:transform}
.kp-entry-coin{display:block;width:100%;height:100%;will-change:transform}
.kp-entry-coin svg{display:block;width:100%;height:100%}
.kp-entry-loader.is-running{animation:kp-entry-reveal 120ms ease-out 900ms forwards}
.kp-entry-loader.is-running .kp-entry-track{animation:kp-entry-travel 900ms linear forwards}
.kp-entry-loader.is-running .kp-entry-coin{animation:kp-entry-roll 900ms linear forwards}
@keyframes kp-entry-travel{to{transform:translateX(calc(100vw + var(--coin-size) * 2))}}
@keyframes kp-entry-roll{to{transform:rotate(var(--roll-angle))}}
@keyframes kp-entry-reveal{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){.kp-entry-loader{display:none;animation:none}.kp-entry-track,.kp-entry-coin{animation:none}}
</style>
<script>
(() => {
  const key = 'kryptopuls-entry-seen-v2';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  try {
    if (sessionStorage.getItem(key)) return;
  } catch { return; }
  // A first reload is eligible; only an actually displayed animation consumes the session.
  if (reduced.matches) return;
  const show = () => {
  if (document.hidden) return;
  document.removeEventListener('visibilitychange', show);
  if (reduced.matches) return;
  try { if (sessionStorage.getItem(key)) return; } catch { return; }
  const overlay = document.createElement('div');
  overlay.className = 'kp-entry-loader';
  overlay.setAttribute('aria-hidden', 'true');
  overlay.innerHTML = '<div class="kp-entry-track"><span class="kp-entry-coin">' + "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 90.7 612 611.1\" aria-hidden=\"true\"><path fill=\"#F7931A\" d=\"M602.7,470c-40.8,163.6-206.6,263.5-370.6,222.7C68.4,651.8-31.4,486.1,9.4,322.5 S215.9,59,379.5,99.8C543.6,140.1,643.4,306.3,602.7,470z\"/><path fill=\"#fff\" d=\"M450.9,356.5c5.5-40.8-25.5-62.1-68-76.5l13.2-55.2l-33.6-8.1l-12.8,54 c-8.9-2.1-17.9-4.2-26.8-6l12.8-54l-34-8.1l-13.2,55.2c-7.2-1.7-14.5-3-21.7-4.7l0,0l-46.3-11.1l-8.5,35.7c0,0,25.1,5.5,24.2,6 c13.6,3.4,16.2,12.3,15.7,19.1l-14.9,62.9c0.9,0.4,2.1,0.4,3.4,1.3c-1.3-0.4-2.1-0.4-3.4-0.8l-20.4,88c-1.7,4.2-6,10.2-15.3,8.1 c0.4,0.4-24.7-6-24.7-6L160.7,495l43.8,10.2c8.1,2.1,16.2,3.8,23.8,6l-13.2,55.7l33.6,8.1l13.2-55.2c9.4,2.5,18.3,4.7,26.8,6.8 l-13.2,54.8l33.6,8.1l13.2-55.7c57.4,10.2,100.3,5.5,117.7-46.8c14-41.7-1.3-65.5-31.9-81.2C430.5,400.7,446.7,386.2,450.9,356.5z M375.3,464.8c-9.8,41.7-80.3,20-102.9,14.5l17.4-74C312.8,410.9,385.5,421.1,375.3,464.8z M384.6,356.5 c-8.9,37.8-67.6,19.6-86.7,14.9l16.2-67.1C332.8,308.9,394,317,384.6,356.5z\"/></svg>" + '</span></div>';
  document.body.appendChild(overlay);
  const size = overlay.querySelector('.kp-entry-track').getBoundingClientRect().width || 64;
  // Circumference = pi * diameter: translation and rotation share linear timing.
  overlay.style.setProperty('--roll-angle', ((innerWidth + size * 2) / (Math.PI * size) * 360) + 'deg');
  let timer;
  let firstFrame;
  let secondFrame;
  const finish = () => {
    clearTimeout(timer);
    cancelAnimationFrame(firstFrame);
    cancelAnimationFrame(secondFrame);
    overlay.remove();
    reduced.removeEventListener('change', finish);
    document.removeEventListener('visibilitychange', visibility);
    document.removeEventListener('keydown', finish);
    window.removeEventListener('pageshow', restore);
  };
  const restore = event => { if (event.persisted) finish(); };
  const visibility = () => { if (document.hidden) finish(); };
  overlay.addEventListener('animationend', event => { if (event.animationName === 'kp-entry-reveal') finish(); });
  reduced.addEventListener('change', finish);
  document.addEventListener('visibilitychange', visibility);
  document.addEventListener('keydown', finish);
  window.addEventListener('pageshow', restore);
  // Native CSS hides it even if JS timers are throttled; this also removes the DOM.
  timer = setTimeout(finish, 1400);
  firstFrame = requestAnimationFrame(() => {
    secondFrame = requestAnimationFrame(() => {
      if (!overlay.isConnected || document.hidden || reduced.matches) { finish(); return; }
      try { sessionStorage.setItem(key, '1'); } catch { /* Display remains bounded without storage. */ }
      overlay.classList.add('is-running');
      clearTimeout(timer);
      timer = setTimeout(finish, 1150);
    });
  });
  };
  if (document.hidden) document.addEventListener('visibilitychange', show);
  else show();
})();
</script>
